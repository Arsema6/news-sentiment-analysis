name: EDA Notebook and Unit Test CI

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  notebook-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt wordcloud
      - name: Execute notebook (EDA)
        run: |
          jupyter nbconvert --to notebook --execute notebooks/news_eda.ipynb --output executed_notebook.ipynb
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests (if any exist)
        run: |
          pytest tests || echo "No tests found, skipping."
